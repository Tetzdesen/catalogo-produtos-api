# Ambiente de desenvolvimento: o banco e o provedor de identidade.
services:
  postgres:
    image: postgres:17-alpine
    container_name: catalogo-postgres
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
    ports:
      - "5432:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a 'docker compose down'.
      # Para começar do zero use 'docker compose down -v'.
      - catalogo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Emite os JWT que a API exige no cadastro, na atualização e na exclusão.
  # Em produção, o papel é de um provedor de verdade (o Keycloak da empresa,
  # Auth0, Cognito...), apontado por JWT_ISSUER_URI.
  #
  # 'start-dev' guarda tudo em memória e '--import-realm' recria o realm a partir
  # de keycloak/realm-catalogo.json a cada subida. Porta 8180 para não disputar
  # a 8080 com a API. Console de administração: http://localhost:8180 (admin/admin).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: catalogo-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  catalogo-postgres-data:
