# Perfil usado pela suíte de testes: banco em memória, sem dependência externa.
spring:
  datasource:
    # MODE=PostgreSQL faz o H2 aceitar a sintaxe das mesmas migrações que rodam
    # em produção; DB_CLOSE_DELAY=-1 mantém o banco vivo enquanto o contexto existir.
    url: jdbc:h2:mem:catalogo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # As mesmas migrações do PostgreSQL rodam aqui: divergência grosseira de DDL
  # quebra o teste antes de chegar ao ambiente real.
  flyway:
    enabled: true
    locations: classpath:db/migration
