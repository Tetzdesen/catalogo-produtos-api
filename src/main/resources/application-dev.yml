# =============================================================================
# Perfil 'dev': o que só vale na máquina de quem desenvolve.
# =============================================================================
# Ativado automaticamente pelo 'mvn spring-boot:run' (ver o spring-boot-maven-plugin
# no pom.xml). O jar empacotado não ativa perfil nenhum, então em produção estes
# padrões não existem e as variáveis DB_* são obrigatórias.

spring:
  datasource:
    # ${VARIAVEL:padrao}: usa a variável de ambiente se existir; senão, o valor
    # depois dos dois-pontos. Os padrões batem com o serviço do docker-compose.yml.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalogo}
    username: ${DB_USER:catalogo}
    password: ${DB_PASSWORD:catalogo}

  security:
    oauth2:
      resourceserver:
        jwt:
          # O Keycloak do docker-compose.yml, com o realm de keycloak/realm-catalogo.json.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/catalogo}
          audiences: ${JWT_AUDIENCE:catalogo-api}

# Em desenvolvimento, a documentação fica sempre ligada (ver application.yml).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
